<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 600" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- White / silver facade gradient with subtle architectural lighting -->
    <linearGradient id="wtcFacade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="6%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="90%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Parapet top edge gradient -->
    <linearGradient id="wtcRoof" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Pattern for 8 vertical black window stripes per floor -->
    <pattern id="wtcWindows" width="8" height="12" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4.4" height="8" fill="#090d16" rx="0.4"/>
      <rect x="4.4" y="0" width="3.6" height="8" fill="transparent"/>
      <rect x="0" y="8" width="8" height="4" fill="transparent"/>
    </pattern>

    <!-- Beacon glow -->
    <radialGradient id="redBeacon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ==================== MAIN TOWER BODY (WHITE WTC) ==================== -->
  <!-- Full-width solid white facade base matching 76px collision box -->
  <rect x="0" y="0" width="76" height="600" fill="url(#wtcFacade)"/>

  <!-- Left corner column (bright white bevel) -->
  <rect x="0" y="0" width="5.5" height="600" fill="#ffffff"/>
  <line x1="5.5" y1="0" x2="5.5" y2="600" stroke="#e2e8f0" stroke-width="0.8"/>

  <!-- Right corner column (subtle shadow bevel) -->
  <rect x="69.5" y="0" width="6.5" height="600" fill="#cbd5e1"/>
  <line x1="69.5" y1="0" x2="69.5" y2="600" stroke="#94a3b8" stroke-width="0.8"/>

  <!-- ==================== ROOFTOP & PARAPET (y=0 to y=22) ==================== -->
  <!-- Flat WTC Roof Edge & Observation Parapet -->
  <rect x="0" y="0" width="76" height="8" fill="url(#wtcRoof)"/>
  <line x1="0" y1="0.8" x2="76" y2="0.8" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="0" y1="8" x2="76" y2="8" stroke="#94a3b8" stroke-width="1"/>

  <!-- Central North Tower Communications Mast -->
  <line x1="38" y1="0" x2="38" y2="10" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="38" cy="2" r="3.5" fill="url(#redBeacon)"/>
  <circle cx="38" cy="2" r="1.3" fill="#ffffff"/>

  <!-- Rooftop perimeter beacons -->
  <circle cx="3" cy="2.5" r="1.2" fill="#ef4444"/>
  <circle cx="73" cy="2.5" r="1.2" fill="#ef4444"/>

  <!-- Upper Mechanical Penthouse Band -->
  <rect x="5.5" y="8" width="64" height="12" fill="#1e293b"/>
  <!-- Penthouse louvers -->
  <line x1="8" y1="11" x2="67" y2="11" stroke="#090d16" stroke-width="1.2"/>
  <line x1="8" y1="14" x2="67" y2="14" stroke="#090d16" stroke-width="1.2"/>
  <line x1="8" y1="17" x2="67" y2="17" stroke="#090d16" stroke-width="1.2"/>
  <rect x="0" y="20" width="76" height="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.6"/>

  <!-- ==================== ICONIC WTC VERTICAL BLACK WINDOWS ==================== -->
  <!-- Upper Tower Zone (y=23 to y=192) -->
  <rect x="5.5" y="23" width="64" height="168" fill="url(#wtcWindows)"/>

  <!-- Mid-Tower Mechanical Band 1 (Iconic WTC Sky Band) -->
  <g id="mech-band-1">
    <rect x="0" y="191" width="76" height="14" fill="#0f172a"/>
    <line x1="0" y1="191" x2="76" y2="191" stroke="#64748b" stroke-width="1"/>
    <!-- Louver grilles -->
    <line x1="6" y1="194" x2="70" y2="194" stroke="#000000" stroke-width="1.2"/>
    <line x1="6" y1="197" x2="70" y2="197" stroke="#000000" stroke-width="1.2"/>
    <line x1="6" y1="200" x2="70" y2="200" stroke="#000000" stroke-width="1.2"/>
    <line x1="0" y1="205" x2="76" y2="205" stroke="#ffffff" stroke-width="1.2"/>
  </g>

  <!-- Mid-Upper Tower Zone (y=206 to y=374) -->
  <rect x="5.5" y="206" width="64" height="168" fill="url(#wtcWindows)"/>

  <!-- Mid-Tower Mechanical Band 2 -->
  <g id="mech-band-2">
    <rect x="0" y="374" width="76" height="14" fill="#0f172a"/>
    <line x1="0" y1="374" x2="76" y2="374" stroke="#64748b" stroke-width="1"/>
    <line x1="6" y1="377" x2="70" y2="377" stroke="#000000" stroke-width="1.2"/>
    <line x1="6" y1="380" x2="70" y2="380" stroke="#000000" stroke-width="1.2"/>
    <line x1="6" y1="383" x2="70" y2="383" stroke="#000000" stroke-width="1.2"/>
    <line x1="0" y1="388" x2="76" y2="388" stroke="#ffffff" stroke-width="1.2"/>
  </g>

  <!-- Lower Tower Zone (y=389 to y=557) -->
  <rect x="5.5" y="389" width="64" height="168" fill="url(#wtcWindows)"/>

  <!-- ==================== WTC BASE TRIDENT ARCHES & LOBBY (y=557 to 600) ==================== -->
  <g id="wtc-lobby">
    <!-- Transition spandrel band -->
    <rect x="0" y="557" width="76" height="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>

    <!-- Lobby Glass (pure black tinted glass) -->
    <rect x="5" y="562" width="65" height="38" fill="#05080f"/>

    <!-- Iconic WTC Yamasaki Ground Trident Columns (narrow white columns branching into arches) -->
    <!-- Column 1 -->
    <rect x="5" y="562" width="4.5" height="38" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
    <!-- Column 2 -->
    <rect x="18" y="562" width="4.5" height="38" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
    <!-- Column 3 -->
    <rect x="31" y="562" width="4.5" height="38" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
    <!-- Column 4 -->
    <rect x="44" y="562" width="4.5" height="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5"/>
    <!-- Column 5 -->
    <rect x="57" y="562" width="4.5" height="38" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5"/>
    <!-- Column 6 -->
    <rect x="66" y="562" width="4" height="38" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.5"/>

    <!-- Lobby Interior Warm Amber Glow behind columns -->
    <rect x="10.5" y="574" width="6.5" height="22" fill="#fbbf24" opacity="0.85" rx="0.5"/>
    <rect x="23.5" y="574" width="6.5" height="22" fill="#fbbf24" opacity="0.85" rx="0.5"/>
    <rect x="36.5" y="574" width="6.5" height="22" fill="#fbbf24" opacity="0.85" rx="0.5"/>
    <rect x="49.5" y="574" width="6.5" height="22" fill="#fbbf24" opacity="0.85" rx="0.5"/>
    <rect x="62" y="574" width="3.5" height="22" fill="#fbbf24" opacity="0.75" rx="0.5"/>

    <!-- Ground Level Plinth -->
    <rect x="0" y="595" width="76" height="5" fill="#64748b"/>
    <line x1="0" y1="595" x2="76" y2="595" stroke="#94a3b8" stroke-width="1"/>
  </g>
</svg>
